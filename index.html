<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ITIL 4 Foundation Mock Exam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--bd:#d8dce6;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa;--bd:#343949;--ac:#7b93ff;--ok:#6fd286;--okb:#1b3324;--no:#ff8787;--nob:#3a1e1e}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa;--bd:#343949;--ac:#7b93ff;--ok:#6fd286;--okb:#1b3324;--no:#ff8787;--nob:#3a1e1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mut);border-bottom:1px solid var(--bd)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.q.bad{border-color:var(--no)}.q.good{border-color:var(--ok)}
.q p{margin:0 0 10px;font-weight:600}
label{display:block;padding:9px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
label:hover{border-color:var(--ac)}
label.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
label.right{border-color:var(--ok);background:var(--okb)}
label.wrong{border-color:var(--no);background:var(--nob)}
input{margin-right:8px}
.fb{font-size:.9rem;margin-top:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer;margin:4px 6px 4px 0}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0;display:none}
#res .big{font-size:2rem;font-weight:700}
#res a{color:var(--no);cursor:pointer;margin-right:8px;display:inline-block}
.note{font-size:.8rem;color:var(--mut)}
</style></head><body><main>
<h1>ITIL 4 Foundation – Mock Exam (40 Qs)</h1>
<div class="bar"><span id="prog">Answered 0 / 40</span><span>Pass mark: 26 / 40 (65%)</span></div>
<div id="res"></div>
<div id="qs"></div>
<button id="sub">Submit &amp; see score</button><button class="sec" id="rst">Reset</button>
<p class="note">Answer key was derived from ITIL 4 Foundation knowledge; verify any disputed item against the official ITIL 4 publication.</p>
</main>
<script>
const Q=[
["What is the accurate approach to handling incidents?",["Incidents with minimal impact should be handled efficiently, eliminating the need for documentation","Incident Management should employ a uniform process no matter the severity","Incidents with minimal impact should be managed efficiently to minimize the resources needed","Incidents with the least severity should be addressed first"],2],
["Which accurately illustrates the interaction of components and activities to enable the creation of value?",["Service value system","Guiding principles","Four dimensions of service management","Service exchange relationship"],0],
["Which practice is responsible for introducing new services into operations?",["Change management","Release management","Deployment management","Service level management"],1],
["Which pair of practices incorporate the use of workarounds?",["Change enablement and service level management","Change enablement and release management","Problem management and incident management","Incident management and continual improvement"],2],
["Which of the following is NOT part of the four dimensions model?",["Organizations and people","Information and technology","Partners and suppliers","Process streams and procedures"],3],
["What changes are NOT typically included in a change schedule?",["Standard change","Normal change","Emergency change","None of the above"],3],
["Who is responsible for continual improvement?",["Senior management","Users","Administrators","Everyone"],3],
["What accurately defines an incident?",["The deliberate decommissioning of a component that may impact a service","An outcome facilitated through one or more deliverables","A potential upcoming event that may result in damage","An interruption in service that can be rectified through self-service option"],3],
["Agile is an umbrella term for frameworks such as:",["Scrum","Lean","Kanban","All of the above"],3],
["Change enablement balances the need to make beneficial changes and _______:",["The method to implement the change","The adverse effect of changes","The evolving needs of the business","The cost of change"],1],
["What accurately defines a service?",["An event with the potential to lead to damages or hinder goal attainment","A means of enabling value co-creation by facilitating outcomes that customers want to achieve without the customer having to manage specific costs and risks","A result either tangible or intangible produced by an action","Collaborative actions by a service provider and consumer aimed at sustained value creation"],1],
["Which practice creates a communication pathway between the service provider and its users?",["Relationship management","Change enablement","Release management","Service desk"],3],
["What choice is defined in ITIL to support the holistic approach in service management?",["Four-dimension model","Two-dimension model","External factors","Service model"],0],
["Which practice coordinates the classification and ownership of an incident?",["Change enablement","Incident management","Problem management","Service desk"],1],
["Events are often classified as (1. Informational, 2. Warning, 3. Exceptions). Which are correct?",["1 and 2","1 and 3","2 and 3","All of the above (1, 2, and 3)"],3],
["What accurately defines warranty?",["A method for recognizing potential harm or loss-inducing events","A method for assuring if a service meets its intended function","A method for pinpointing a desirable outcome for a stakeholder","A means of determining whether a service is fit for use"],1],
["Which statement accurately describes a standard change?",["Every implementation necessitates a comprehensive evaluation","It's possible to proceed with minimal testing","A specific authority level should be designated for each variation of change","This type of change bypasses the need for further approval"],3],
["What is identified as a cause or possible cause of one or more incidents?",["Incident","Workaround","Release","Problem"],3],
["What is a tangible or intangible deliverable of an activity?",["Outcome","Output","Deliverable","Scope"],1],
["Which deployment approach deploys new or changed components to all targets at the same time?",["Phased deployment","Continuous delivery","Big Bang deployment","Pull deployment"],2],
["_______ is any financially valuable component that can contribute to the delivery of an IT product or service:",["Service asset","Product asset","User asset","IT asset"],0],
["What ensures that someone cannot deny that they took an action?",["Confidentiality","Integrity","Non-repudiation","Availability"],2],
["What is defined as the addition, modification, or removal of anything that could have a direct or indirect effect on services?",["Service modification","Service request","Service adjustment","Service change"],3],
["Every incident should be:",["Reported to management","Escalated to higher support","Analyzed for problems","Logged"],3],
["Which step in the continual improvement model provides context for all subsequent decisions and links actions to the organization's vision?",["What is the vision?","Where are we now?","Where do we want to be?","How do we get there?"],0],
["After \"Where are we now?\", what should you do next in the continual improvement model?",["Determine where do we want to be","Determine how to get there","Determine how to keep going","Determine how to take action"],0],
["What can have a significant impact on the technology a company chooses?",["Time needed","Culture","Risk","Scope"],1],
["What is a series of steps an organization undertakes to create and deliver products and services to consumers?",["Value maps","Process maps","Process streams","Value stream"],3],
["What does the 'S' in the PESTLE framework mean?",["Service","Sector","Set","Social"],3],
["What is a recommendation that guides an organization in all circumstances, regardless of changes in goals, strategies, type of work, or management structure?",["Guiding service","Guiding principle","Service principle","Management principle"],1],
["The ITIL continual improvement model has _______ steps:",["5","6","7","8"],2],
["Which practice manages all predefined actions initiated by users?",["Release management","Problem management","Service level management","Service request management"],3],
["What is an example of a service request?",["A request for the reinstatement of standard service operations","A request for the application of a security update","A request for an entry to a document","A request for the exploration of an incident's origin"],1],
["Which two inputs are needed for the SVS? (1. Demand, 2. Products, 3. Value, 4. Opportunity)",["1 and 2","1 and 4","2 and 3","3 and 4"],1],
["What do you call a problem that has been examined but remains unsolved?",["Workaround","Incident","Known error","Problem"],2],
["Which ITIL concept aids an organization in making informed decisions?",["The four dimensions of service management","The guiding principles","The service value chain","The 34 ITIL practices"],1],
["Which principle advises removing work that offers minimal or no benefit to the organization or its customers?",["Keep it simple and practical","Focus on value","Start where you are","Progress iteratively with feedback"],0],
["_______ is the procurement of a product or service from more than one independent supplier:",["Outsourcing","Multisourcing","Insourcing","Single sourcing"],1],
["Which guiding principle recommends using existing services, processes, and tools while improving services?",["Progress iteratively with feedback","Keep it simple and practical","Start where you are","Optimize and automate"],2],
["Which are steps in the continual improvement model? (1. What is the vision?, 2. Where do we want to be?, 3. How to measure the progress, 4. Take action)",["1 and 2","1 and 3","1, 2, and 4","All of the above"],2]
];
const L="ABCD",ans={},$=s=>document.querySelector(s);
let done=false;
function render(){
 $('#qs').innerHTML=Q.map((q,i)=>`<div class="q" id="q${i}"><p>${i+1}. ${q[0]}</p>`+q[1].map((o,j)=>`<label id="l${i}_${j}"><input type="radio" name="q${i}" value="${j}">${L[j]}. ${o}</label>`).join('')+`<div class="fb"></div></div>`).join('');
 document.querySelectorAll('input').forEach(r=>r.onchange=()=>{
  if(done)return;const i=+r.name.slice(1);ans[i]=+r.value;
  Q[i][1].forEach((_,j)=>$('#l'+i+'_'+j).classList.toggle('sel',j==ans[i]));
  $('#prog').textContent=`Answered ${Object.keys(ans).length} / 40`;});
}
$('#sub').onclick=()=>{
 const un=Q.map((_,i)=>i).filter(i=>!(i in ans));
 if(un.length&&!confirm(un.length+' question(s) unanswered (counted as wrong). Submit anyway?'))return;
 done=true;let s=0,wrong=[];
 Q.forEach((q,i)=>{
  const ok=ans[i]===q[2];if(ok)s++;else wrong.push(i);
  const box=$('#q'+i);box.classList.add(ok?'good':'bad');
  q[1].forEach((_,j)=>{const l=$('#l'+i+'_'+j);l.classList.remove('sel');l.querySelector('input').disabled=true;
   if(j==q[2])l.classList.add('right');else if(j==ans[i])l.classList.add('wrong');});
  box.querySelector('.fb').innerHTML=ok?`<span style="color:var(--ok)">✔ Correct</span>`:`<span style="color:var(--no)">✘ ${i in ans?'Your answer: '+L[ans[i]]:'Not answered'} — Correct answer: ${L[q[2]]}</span>`;
 });
 const r=$('#res');r.style.display='block';
 r.innerHTML=`<div class="big">${s} / 40 (${Math.round(s/40*100)}%)</div><div>${s>=26?'🎉 Pass':'Below pass mark (26)'} · ${wrong.length} wrong</div>`+
  (wrong.length?`<p><b>Wrong questions (tap to jump):</b><br>${wrong.map(i=>`<a onclick="document.getElementById('q${i}').scrollIntoView({behavior:'smooth'})">Q${i+1}</a>`).join('')}</p>`:'<p>Perfect score!</p>');
 window.scrollTo({top:0,behavior:'smooth'});
};
$('#rst').onclick=()=>{done=false;for(const k in ans)delete ans[k];$('#res').style.display='none';$('#prog').textContent='Answered 0 / 40';render();window.scrollTo(0,0)};
render();
</script></body></html>
